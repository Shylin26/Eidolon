name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./internal/context/... -v -timeout 30s
